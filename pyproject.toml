[project]
name = "amber-mcp"
version = "0.1.0"
description = "MCP server that drives AmberIT's IP line on a Redmi/MIUI phone"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastmcp>=2.14,<3",
    "pillow>=11.2.1",
    "uiautomator2>=3.3.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
amber-mcp = "amber_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amber_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a connected phone and a real call (deselected unless AMBER_LIVE=1)"]
addopts = "-m 'not live'"
# fastmcp 2.14 imports authlib, whose deprecation shim registers its own
# "always" filter for AuthlibDeprecationWarning, so a plain DeprecationWarning
# ignore -- on the command line or in ini -- cannot override it. The one class
# that has to go is this: two third-party warnings, emitted once when the server
# module is imported, that we do not own and cannot fix from our tree. Naming the
# exact category (not a message or a blanket Deprecation) means no warning from
# our own code can hide behind it; the suite stays at zero without going blind.
filterwarnings = [
    "ignore::authlib.deprecate.AuthlibDeprecationWarning",
]
